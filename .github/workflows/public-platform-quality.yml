name: Public platform quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  public-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --check public/cinematic.js
      - run: npm run lint
      - run: npm run build
      - run: npx playwright test tests/public-platform.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-platform-test-results
          path: |
            playwright-report
            test-results
