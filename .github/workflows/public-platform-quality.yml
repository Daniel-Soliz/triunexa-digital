name: Public platform quality
on:
  push:
    branches: [main, codex/emerald-scroll-sequence, codex/futuristic-directory]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  public-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium
        timeout-minutes: 3
      - run: node --check public/cinematic.js
      - run: npm run lint
      - run: npm run build
      - run: npx playwright test tests/public-platform.spec.ts tests/onda-landing.spec.ts tests/onda-experience.spec.ts tests/onda-scroll.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-platform-test-results
          path: |
            playwright-report
            test-results
